name: Push to GitHub

on:
  workflow_dispatch:

jobs:
  push-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure Git and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: nawedy
          REPOSITORY: OOMMAH-PLATFORM
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          
          # Remove existing origin if it exists
          git remote remove origin || true
          
          # Add new origin
          git remote add origin https://${GITHUB_TOKEN}@github.com/${USERNAME}/${REPOSITORY}.git
          
          # Ensure we have all the files staged
          git add -A
          
          # Create commit (will only create if there are changes)
          git diff --quiet && git diff --staged --quiet || git commit -m "Push from V0"
          
          # Force push to main branch
          git push --force origin main
