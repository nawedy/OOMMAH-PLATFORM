name: Push to GitHub

on:
  workflow_dispatch:

jobs:
  push-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Push to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote add github https://${GITHUB_TOKEN}@github.com/nawedy/OOMMAH-PLATFORM.git
          git add .
          git commit -m "Push from V0"
          git push github main

