name: Push Workflow
permissions:
  contents: write  # This is like giving your workflow a master key to the repository

on: [push]  # Triggers when code is pushed
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Git Configuration and Push
        run: |
          # Set up who's making the changes
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Update remote origin
          git remote remove origin || true
          git remote add origin "https://$GITHUB_TOKEN@github.com/$USERNAME/$REPOSITORY.git"
          
          # Stage and commit changes
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Push from V0"
          
          # Push to main branch
          git push --force origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: nawedy
          REPOSITORY: OOMMAH-PLATFORM
