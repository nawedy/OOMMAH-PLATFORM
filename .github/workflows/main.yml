name: Push to GitHub

on:
  workflow_dispatch:

jobs:
  push-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Push to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: nawedy  # Replace with your GitHub username
          REPOSITORY: oommah-platform # Replace with your repository name
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote add origin https://${GITHUB_TOKEN}@github.com/nawedy/OOMMAH-PLATFORM.git
          git add .
          git commit -m "Push from V0"
          git push --force origin main # Force push to overwrite remote content

